<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0c29">
    <meta name="description" content="Tetris Wifiweb - Il classico gioco Tetris con branding personalizzato">
    <title>Tetris Wifiweb</title>
    <link rel="manifest" href="data:application/json,{}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(180deg, #0f0c29, #302b63, #24243e);
            font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif;
            color: white;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        .wifiweb-header {
            text-align: center;
            padding: env(safe-area-inset-top, 8px) 10px 4px;
            background: linear-gradient(90deg, rgba(255,0,128,0.15), rgba(0,204,255,0.15));
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .wifiweb-logo {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: clamp(1rem, 4vw, 1.4rem); font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(90deg, #ff0080, #7928ca, #00d4ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .wifiweb-logo .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff0080; display: inline-block; animation: pulse 2s infinite; }

        @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }

        .level-bar-container {
            margin-top: 4px; width: 80%; max-width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-left: auto; margin-right: auto;
        }

        .level-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff0080, #00d4ff); border-radius: 3px; transition: width 0.3s ease; }

        .level-name { font-size: clamp(0.5rem, 2vw, 0.7rem); color: rgba(255,255,255,0.5); margin-top: 2px; min-height: 1em; }

        .game-stats {
            display: flex; justify-content: space-around; align-items: center;
            padding: 4px 10px; flex-shrink: 0;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: clamp(0.5rem, 2vw, 0.65rem); color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: clamp(0.9rem, 3vw, 1.2rem); font-weight: 700; color: #00d4ff; }

        .game-main {
            display: flex; gap: 8px; align-items: flex-start; justify-content: center;
            flex: 1; min-height: 0; padding: 4px 8px;
        }

        .board-frame {
            border: 2px solid rgba(0,212,255,0.4); border-radius: 6px;
            box-shadow: 0 0 25px rgba(0,212,255,0.15), inset 0 0 15px rgba(0,0,0,0.4);
            overflow: hidden; flex-shrink: 0; position: relative;
        }

        #game-canvas { display: block; background: rgba(0,0,0,0.6); }

        .side-panel { display: flex; flex-direction: column; gap: 6px; min-width: 70px; }

        .panel-box {
            background: rgba(0,0,0,0.35); padding: 8px 6px; border-radius: 8px;
            border: 1px solid rgba(0,212,255,0.15); text-align: center;
        }

        .panel-box h3 { font-size: clamp(0.45rem, 1.8vw, 0.6rem); color: #00d4ff; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px; }

        .score-val { font-size: clamp(1rem, 3.5vw, 1.4rem); font-weight: 900; color: #ffcc00; }

        #next-piece-canvas { display: block; margin: 0 auto; }

        .combo-display {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            font-size: 2rem; font-weight: 900; color: #ff0080; text-shadow: 0 0 30px rgba(255,0,128,0.8);
            pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 5;
        }

        .combo-display.show { opacity: 1; animation: comboPop 0.6s ease-out; }

        @keyframes comboPop { 0% { transform: translate(-50%,-50%) scale(0.5); opacity: 0; } 50% { transform: translate(-50%,-50%) scale(1.3); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }

        .level-up-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,212,255,0.4), transparent);
            pointer-events: none; opacity: 0; z-index: 4;
        }

        .level-up-flash.show { animation: flashAnim 0.8s ease-out; }

        @keyframes flashAnim { 0% { opacity: 1; } 100% { opacity: 0; } }

        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10; backdrop-filter: blur(5px);
        }

        .overlay-screen.active { display: flex; }

        .overlay-title { font-size: clamp(1.5rem, 6vw, 2.5rem); font-weight: 900; letter-spacing: 4px; margin-bottom: 20px; }

        .title-gradient { background: linear-gradient(90deg, #ff0080, #7928ca, #00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        .overlay-subtitle { font-size: clamp(0.7rem, 2.5vw, 0.9rem); color: rgba(255,255,255,0.6); margin-bottom: 8px; }

        .play-btn, .restart-btn {
            background: linear-gradient(90deg, #ff0080, #7928ca); border: none;
            padding: 12px 35px; font-size: clamp(1rem, 3.5vw, 1.2rem); color: white;
            border-radius: 25px; cursor: pointer; font-weight: 700; font-family: inherit;
            margin-top: 15px; letter-spacing: 2px; transition: transform 0.15s;
        }

        .play-btn:active, .restart-btn:active { transform: scale(0.95); }

        .controls-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: auto auto;
            gap: clamp(4px, 1vw, 8px);
            padding: env(safe-area-inset-bottom, 8px) 8px 8px;
            flex-shrink: 0;
        }

        .ctrl-btn {
            background: rgba(0,212,255,0.08); border: 2px solid rgba(0,212,255,0.25);
            border-radius: clamp(8px, 2vw, 14px); color: #00d4ff;
            font-size: clamp(1.2rem, 4.5vw, 1.8rem); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.1s ease; min-height: 48px; font-family: inherit;
        }

        .ctrl-btn:active { background: rgba(0,212,255,0.3); border-color: #00d4ff; transform: scale(0.92); }

        .ctrl-btn.drop-ctrl { grid-column: 1 / -1; font-size: clamp(0.7rem, 2.5vw, 0.9rem); background: rgba(255,0,128,0.1); border-color: rgba(255,0,128,0.3); color: #ff0080; letter-spacing: 2px; }
        .ctrl-btn.drop-ctrl:active { background: rgba(255,0,128,0.3); border-color: #ff0080; }

        .rainbow-mode body { animation: rainbowBg 3s linear infinite; }
        @keyframes rainbowBg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
    </style>
</head>
<body>
    <!-- Header Wifiweb -->
    <div class="wifiweb-header">
        <div class="wifiweb-logo">
            <span class="dot"></span> WIFIWEB <span class="dot" style="background:#00d4ff;animation-delay:1s"></span>
        </div>
        <div class="level-bar-container"><div class="level-bar" id="level-bar"></div></div>
        <div class="level-name" id="level-name">Livello 1: Principiante</div>
    </div>

    <!-- Stats bar -->
    <div class="game-stats">
        <div class="stat-item"><div class="stat-label">Punteggio</div><div class="stat-value" id="score">0</div></div>
        <div class="stat-item"><div class="stat-label">Livello</div><div class="stat-value" id="level">1</div></div>
        <div class="stat-item"><div class="stat-label">Righe</div><div class="stat-value" id="lines">0</div></div>
        <div class="stat-item"><div class="stat-label">Combo</div><div class="stat-value" id="combo-display" style="color:#ff0080">x1</div></div>
    </div>

    <!-- Main game area -->
    <div class="game-main">
        <div class="board-frame" id="board-frame">
            <canvas id="game-canvas"></canvas>
            <div class="level-up-flash" id="level-up-flash"></div>
            <div class="combo-display" id="combo-popup"></div>

            <!-- Start screen -->
            <div class="overlay-screen active" id="start-screen">
                <div class="overlay-title title-gradient">TETRIS</div>
                <div class="overlay-subtitle">Wifiweb Edition</div>
                <button class="play-btn" onclick="startGame()">GIOCA</button>
                <div class="overlay-subtitle" style="margin-top:15px;font-size:clamp(0.5rem,2vw,0.65rem)">
                    ↑↑↓↓←→←→BA = Segreto!<br>
                    Scorri per muovere • Tocca per ruotare
                </div>
            </div>

            <!-- Game over -->
            <div class="overlay-screen" id="game-over">
                <div class="overlay-title" style="color:#ff4444;text-shadow:0 0 20px rgba(255,68,68,0.7)">GAME OVER</div>
                <div class="overlay-subtitle" id="final-score">Punteggio: 0</div>
                <div class="overlay-subtitle" id="final-level">Livello raggiunto: 1</div>
                <button class="restart-btn" onclick="restartGame()">Ricomincia</button>
            </div>

            <!-- Pause -->
            <div class="overlay-screen" id="pause-overlay">
                <div class="overlay-title title-gradient">PAUSA</div>
                <button class="play-btn" onclick="togglePause()">Continua</button>
            </div>
        </div>

        <!-- Side panel -->
        <div class="side-panel">
            <div class="panel-box">
                <h3>Prossimo</h3>
                <canvas id="next-piece-canvas"></canvas>
            </div>
            <div class="panel-box">
                <h3>Controlli</h3>
                <div style="font-size:clamp(0.45rem,1.6vw,0.55rem);color:rgba(255,255,255,0.4);line-height:1.6">
                    ← → Muovi<br>↑ Ruota<br>↓ Scendi<br>Drop: Caduta
                </div>
            </div>
        </div>
    </div>

    <!-- Touch Controls -->
    <div class="controls-bar">
        <button class="ctrl-btn" data-action="rotate">↻</button>
        <button class="ctrl-btn" data-action="left">←</button>
        <button class="ctrl-btn" data-action="down">↓</button>
        <button class="ctrl-btn" data-action="right">→</button>
        <button class="ctrl-btn" data-action="pause">⏸</button>
        <button class="ctrl-btn drop-ctrl" data-action="drop">⬇ CADUTA ⬇</button>
    </div>

    <script>
        // ==================== CONFIGURAZIONE ====================
        const COLS = 10;
        const ROWS = 20;
        let BLOCK_SIZE = 28;

        // Canvas
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-piece-canvas');
        const nextCtx = nextCanvas.getContext('2d');

        // Responsive sizing
        function resizeCanvas() {
            const headerH = 50;
            const controlsH = 160;
            const padding = 40;
            const availableH = window.innerHeight - headerH - controlsH - padding;
            const availableW = Math.min(window.innerWidth - 30, 320);

            BLOCK_SIZE = Math.floor(Math.min(availableW / COLS, availableH / ROWS));
            BLOCK_SIZE = Math.max(BLOCK_SIZE, 18);
            BLOCK_SIZE = Math.min(BLOCK_SIZE, 32);

            canvas.width = BLOCK_SIZE * COLS;
            canvas.height = BLOCK_SIZE * ROWS;

            const ns = Math.max(60, Math.min(100, window.innerWidth * 0.2));
            nextCanvas.width = ns;
            nextCanvas.height = ns;
        }
        resizeCanvas();
        window.addEventListener('resize', () => { resizeCanvas(); drawBoard(); drawPiece(); drawNextPiece(); });

        // ==================== TESSERE ====================
        const SHAPES = [
            { shape: [[1,1,1,1]], color: '#00ffff' },
            { shape: [[1,1],[1,1]], color: '#ffff00' },
            { shape: [[0,1,0],[1,1,1]], color: '#cc00ff' },
            { shape: [[0,1,1],[1,1,0]], color: '#00ff44' },
            { shape: [[1,1,0],[0,1,1]], color: '#ff3333' },
            { shape: [[1,0,0],[1,1,1]], color: '#3366ff' },
            { shape: [[0,0,1],[1,1,1]], color: '#ff8c00' }
        ];

        // ==================== STATO DI GIOCO ====================
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let combo = 0;
        let gameLoop = null;
        let isGameOver = false;
        let isPaused = false;
        let isGameStarted = false;
        let dropInterval = 1000;
        let rainbowMode = false;
        let particles = [];
        let konamiBuffer = '';
        const KONAMI_CODE = 'ArrowUpArrowUpArrowDownArrowDownArrowLeftArrowRightArrowLeftArrowRightb';

        // Nomi dei livelli
        const LEVEL_NAMES = [
            'Principiante', 'Novellino', 'Apprendista', 'Dilettante', 'Giocatore',
            'Avanzato', 'Esperto', 'Veterano', 'Maestro', 'Gran Maestro',
            'Leggenda', 'Divino', 'Olimpico', 'Cosmico', 'Eterno'
        ];

        function getLevelName(l) {
            const idx = Math.min(l - 1, LEVEL_NAMES.length - 1);
            return LEVEL_NAMES[idx] || `Livello ${l}`;
        }

        // Particelle
        function spawnParticles(rowY) {
            for (let i = 0; i < 40; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: rowY * BLOCK_SIZE + BLOCK_SIZE / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 4 - 2,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.02,
                    size: 2 + Math.random() * 4,
                    hue: Math.random() * 360
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.08;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = `hsl(${p.hue}, 100%, 65%)`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Konami Code
        function checkKonami(key) {
            konamiBuffer += key;
            if (konamiBuffer.length > KONAMI_CODE.length) konamiBuffer = konamiBuffer.slice(-KONAMI_CODE.length);
            if (konamiBuffer === KONAMI_CODE) {
                rainbowMode = !rainbowMode;
                document.body.classList.toggle('rainbow-mode', rainbowMode);
                showComboPopup(rainbowMode ? '🌈 RAINBOW MODE!' : '🌈 Disattivato');
                konamiBuffer = '';
            }
        }

        function showComboPopup(text) {
            const el = document.getElementById('combo-popup');
            if (!el) return;
            el.textContent = text;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 1500);
        }

        function flashLevelUp() {
            const el = document.getElementById('level-up-flash');
            if (!el) return;
            el.classList.add('flash');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('flash'), 800);
        }

        function updateLevelBar() {
            const bar = document.getElementById('level-bar');
            if (!bar) return;
            const progress = (lines % 10) / 10 * 100;
            bar.style.width = `${progress}%`;
            if (rainbowMode) {
                bar.style.background = 'linear-gradient(90deg, #ff0000, #ff8800, #ffff00, #00ff00, #0088ff, #cc00ff)';
            } else {
                bar.style.background = 'linear-gradient(90deg, #00d4ff, #cc00ff)';
            }
        }

        // ==================== FUNZIONI BORDO ====================
        function createBoard() {
            return Array(ROWS).fill().map(() => Array(COLS).fill(null));
        }

        function createPiece() {
            const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
            return { shape: s.shape.map(r => [...r]), color: s.color, x: Math.floor(COLS/2) - Math.floor(s.shape[0].length/2), y: 0 };
        }

        // ==================== DISEGNO ====================
        function drawBlock(context, x, y, color, size) {
            const s = size || BLOCK_SIZE;
            const p = 1;
            let drawColor = color;

            if (rainbowMode) {
                const hue = ((x + y + Date.now() * 0.02) % 360 + 360) % 360;
                drawColor = `hsl(${hue}, 100%, 60%)`;
            }

            context.fillStyle = drawColor;
            context.fillRect(x*s+p, y*s+p, s-p*2, s-p*2);

            // Highlight top-left
            const g = context.createLinearGradient(x*s, y*s, x*s+s, y*s+s);
            g.addColorStop(0, 'rgba(255,255,255,0.35)');
            g.addColorStop(0.4, 'rgba(255,255,255,0)');
            g.addColorStop(1, 'rgba(0,0,0,0.25)');
            context.fillStyle = g;
            context.fillRect(x*s+p, y*s+p, s-p*2, s-p*2);

            // Inner border highlight
            context.strokeStyle = rainbowMode ? `hsla(${(((x+y)*30+Date.now()*0.03)%360+360)%360}, 100%, 80%, 0.5)` : 'rgba(255,255,255,0.25)';
            context.lineWidth = 1;
            context.beginPath();
            context.moveTo((x+1)*s-p, y*s+p);
            context.lineTo(x*s+p, y*s+p);
            context.lineTo(x*s+p, (y+1)*s-p);
            context.stroke();

            // Dark border
            context.strokeStyle = 'rgba(0,0,0,0.4)';
            context.lineWidth = 1;
            context.strokeRect(x*s+p, y*s+p, s-p*2, s-p*2);
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background
            if (rainbowMode) {
                const hue = (Date.now() * 0.01) % 360;
                ctx.fillStyle = `hsl(${hue}, 30%, 8%)`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Grid
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i*BLOCK_SIZE,0); ctx.lineTo(i*BLOCK_SIZE,canvas.height); ctx.stroke(); }
            for (let i = 0; i <= ROWS; i++) { ctx.beginPath(); ctx.moveTo(0,i*BLOCK_SIZE); ctx.lineTo(canvas.width,i*BLOCK_SIZE); ctx.stroke(); }

            // Placed blocks
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x]) drawBlock(ctx, x, y, board[y][x]);
                }
            }

            // Ghost piece
            if (currentPiece && !isPaused && !isGameOver) {
                let gy = currentPiece.y;
                while (isValid(currentPiece, 0, gy - currentPiece.y + 1)) gy++;
                if (gy !== currentPiece.y) {
                    ctx.globalAlpha = 0.15;
                    currentPiece.shape.forEach((row, y) => row.forEach((v, x) => { if(v) drawBlock(ctx, currentPiece.x+x, gy+y, currentPiece.color); }));
                    ctx.globalAlpha = 1;
                }
            }

            // Particles
            updateParticles();
            drawParticles();
        }

        function drawPiece() {
            if (!currentPiece || isPaused || isGameOver) return;
            currentPiece.shape.forEach((row, y) => row.forEach((v, x) => { if(v) drawBlock(ctx, currentPiece.x+x, currentPiece.y+y, currentPiece.color); }));
        }

        // Animazione rendering continuo (per rainbow + particelle)
        let animFrameId = null;
        function renderLoop() {
            if (!isPaused && !isGameOver && isGameStarted) {
                drawBoard();
                drawPiece();
            }
            animFrameId = requestAnimationFrame(renderLoop);
        }

        function drawNextPiece() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (!nextPiece) return;
            const bs = Math.floor(nextCanvas.width / (Math.max(nextPiece.shape[0].length, nextPiece.shape.length) + 1));
            const ox = (nextCanvas.width - nextPiece.shape[0].length * bs) / 2;
            const oy = (nextCanvas.height - nextPiece.shape.length * bs) / 2;
            nextPiece.shape.forEach((row, y) => row.forEach((v, x) => { if(v) drawBlock(nextCtx, ox/bs+x, oy/bs+y, nextPiece.color, bs); }));
        }

        // ==================== LOGICA DI GIOCO ====================
        function isValid(piece, dx=0, dy=0) {
            return piece.shape.every((row, y) => row.every((v, x) => {
                if (!v) return true;
                const nx = piece.x + x + dx, ny = piece.y + y + dy;
                return nx >= 0 && nx < COLS && ny < ROWS && (ny < 0 || !board[ny][nx]);
            }));
        }

        function movePiece(dx, dy) {
            if (isPaused || isGameOver || !currentPiece) return false;
            if (isValid(currentPiece, dx, dy)) { currentPiece.x += dx; currentPiece.y += dy; return true; }
            return false;
        }

        function rotatePiece() {
            if (isPaused || isGameOver || !currentPiece) return;
            const orig = currentPiece.shape.map(r => [...r]);
            const rot = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(r => r[i]).reverse());
            currentPiece.shape = rot;
            const kicks = [0, -1, 1, -2, 2];
            if (!kicks.some(k => { if (isValid(currentPiece, k, 0)) { currentPiece.x += k; return true; } return false; })) {
                currentPiece.shape = orig;
            }
        }

        function hardDrop() {
            if (isPaused || isGameOver) return;
            let d = 0;
            while (isValid(currentPiece, 0, 1)) { currentPiece.y++; d++; }
            score += d * 2;
            updateUI();
            lockPiece();
        }

        function softDrop() {
            if (!movePiece(0, 1)) lockPiece();
            else { score += 1; updateUI(); }
        }

        function lockPiece() {
            currentPiece.shape.forEach((row, y) => row.forEach((v, x) => { if(v && currentPiece.y+y >= 0) board[currentPiece.y+y][currentPiece.x+x] = currentPiece.color; }));

            let cleared = 0;
            const clearedRows = [];
            for (let y = ROWS-1; y >= 0; y--) {
                if (board[y].every(c => c !== null)) { clearedRows.push(y); cleared++; y++; }
            }

            if (cleared > 0) {
                // Combo system
                combo++;
                const pts = [0, 100, 300, 500, 800];
                const comboMultiplier = Math.min(combo, 5);
                score += pts[cleared] * level * comboMultiplier;

                // Particelle per ogni riga completata
                clearedRows.forEach(ry => spawnParticles(ry));

                // Rimuovi righe
                clearedRows.sort((a,b) => a-b).forEach(ry => { board.splice(ry,1); board.unshift(Array(COLS).fill(null)); });

                lines += cleared;
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    dropInterval = Math.max(100, 1000 - (level-1) * 80);
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, dropInterval);
                    flashLevelUp();
                    showComboPopup(`⬆ ${getLevelName(level)}!`);

                    // Attiva rainbow mode ad alti livelli
                    if (level >= 10 && !rainbowMode) {
                        rainbowMode = true;
                        document.body.classList.add('rainbow-mode');
                        showComboPopup('🌈 Rainbow Mode sbloccato!');
                    }
                }

                // Popup combo
                if (combo > 1) {
                    showComboPopup(`🔥 Combo x${comboMultiplier}!`);
                }
            } else {
                combo = 0;
            }

            updateLevelBar();
            updateUI();
            currentPiece = nextPiece;
            nextPiece = createPiece();
            drawNextPiece();

            if (!isValid(currentPiece)) gameOver();
        }

        function updateUI() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('level').textContent = level;
            document.getElementById('lines').textContent = lines;
            const comboEl = document.getElementById('combo-display');
            if (comboEl) comboEl.textContent = `x${Math.min(combo + 1, 5)}`;
        }

        // ==================== FLUSSO DI GIOCO ====================
        function update() {
            if (isPaused || isGameOver) return;
            if (!movePiece(0, 1)) lockPiece();
        }

        function gameOver() {
            isGameOver = true;
            clearInterval(gameLoop);
            cancelAnimationFrame(animFrameId);
            document.getElementById('final-score').textContent = `Punteggio: ${score.toLocaleString()}`;
            const finalLevelEl = document.getElementById('final-level');
            if (finalLevelEl) finalLevelEl.textContent = `Livello raggiunto: ${level} (${getLevelName(level)})`;
            document.getElementById('game-over').classList.add('active');
        }

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            isGameStarted = true;
            restartGame();
        }

        function restartGame() {
            board = createBoard();
            score = 0; level = 1; lines = 0; combo = 0; dropInterval = 1000;
            rainbowMode = false;
            particles = [];
            isGameOver = false; isPaused = false;
            updateUI();
            updateLevelBar();
            document.getElementById('game-over').classList.remove('active');
            document.getElementById('pause-overlay').classList.remove('active');
            currentPiece = createPiece();
            nextPiece = createPiece();
            drawNextPiece();
            clearInterval(gameLoop);
            cancelAnimationFrame(animFrameId);
            gameLoop = setInterval(update, dropInterval);
            renderLoop();
        }

        function togglePause() {
            if (isGameOver) return;
            isPaused = !isPaused;
            document.getElementById('pause-overlay').classList.toggle('active', isPaused);
        }

        // ==================== CONTROLLI TASTIERA ====================
        document.addEventListener('keydown', e => {
            checkKonami(e.key);
            switch(e.key) {
                case 'ArrowLeft': movePiece(-1,0); break;
                case 'ArrowRight': movePiece(1,0); break;
                case 'ArrowDown': softDrop(); break;
                case 'ArrowUp': rotatePiece(); break;
                case ' ': hardDrop(); e.preventDefault(); break;
                case 'p': case 'P': togglePause(); break;
            }
        });

        // ==================== CONTROLLI TOUCH ====================
        document.querySelectorAll('.touch-btn').forEach(btn => {
            const action = btn.dataset.action;
            let repeatTimer = null;

            const doAction = (e) => { e.preventDefault();
                switch(action) {
                    case 'left': movePiece(-1,0); break;
                    case 'right': movePiece(1,0); break;
                    case 'down': softDrop(); break;
                    case 'rotate': rotatePiece(); break;
                    case 'drop': hardDrop(); break;
                    case 'pause': togglePause(); break;
                }
            };

            btn.addEventListener('touchstart', e => { doAction(e);
                if (['left','right','down'].includes(action)) repeatTimer = setInterval(doAction, 120);
            });
            btn.addEventListener('touchend', e => { e.preventDefault(); if(repeatTimer) { clearInterval(repeatTimer); repeatTimer=null; } });
            btn.addEventListener('touchcancel', () => { if(repeatTimer) { clearInterval(repeatTimer); repeatTimer=null; } });
            btn.addEventListener('mousedown', doAction);
        });

        // Swipe sul canvas
        let tx = 0, ty = 0, tt = 0;
        canvas.addEventListener('touchstart', e => { e.preventDefault(); const t=e.touches[0]; tx=t.clientX; ty=t.clientY; tt=Date.now(); }, {passive:false});
        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            if (isPaused || isGameOver) return;
            const t = e.touches[0];
            const dx = t.clientX - tx, dy = t.clientY - ty;
            const th = BLOCK_SIZE * 0.7;
            if (Math.abs(dx) > th) { movePiece(dx>0?1:-1, 0); tx=t.clientX; }
            if (dy > th) { softDrop(); ty=t.clientY; }
        }, {passive:false});
        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            if (Date.now()-tt < 200) { rotatePiece(); }
        }, {passive:false});

        // ==================== SERVICE WORKER INLINE ====================
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
            `;
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(() => {});
        }

        // ==================== MANIFEST INLINE ====================
        const manifest = {
            name: "Tetris Wifiweb",
            short_name: "Wifiweb Tetris",
            description: "Il classico gioco Tetris con grafica moderna e controlli touch — Wifiweb Edition",
            start_url: ".",
            display: "standalone",
            orientation: "portrait",
            background_color: "#0a0a1a",
            theme_color: "#00ffcc",
            icons: [{ src: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="#1a1a2e"/><rect x="204" y="164" width="104" height="104" rx="12" fill="#cc00ff"/><rect x="100" y="268" width="104" height="104" rx="12" fill="#cc00ff"/><rect x="204" y="268" width="104" height="104" rx="12" fill="#cc00ff"/><rect x="308" y="268" width="104" height="104" rx="12" fill="#cc00ff"/><rect x="100" y="60" width="104" height="104" rx="12" fill="#00ffff"/><rect x="204" y="60" width="104" height="104" rx="12" fill="#00ffff"/></svg>'), sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.querySelector('link[rel="manifest"]').href = URL.createObjectURL(manifestBlob);

        // ==================== INIZIALIZZAZIONE ====================
        board = createBoard();
        currentPiece = createPiece();
        nextPiece = createPiece();
        drawNextPiece();
    </script>
</body>
</html>
